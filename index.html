const $=s=>document.querySelector(s);let page='p1',remaining=43,tick,started=false,fire=false,detector,blown=false,blowAt=0,faceStream=null,micStream=null,audioCtx=null,micFrame=0,micArmed=false;const music=$('#music'),musicToggle=$('#musicToggle');music.volume=.65;function syncMusicToggle(){const playing=!music.paused;musicToggle.textContent=playing?'Ⅱ 暂停音乐':'♫ 播放音乐';musicToggle.setAttribute('aria-label',playing?'暂停背景音乐':'播放背景音乐')}music.addEventListener('play',syncMusicToggle);music.addEventListener('pause',syncMusicToggle);musicToggle.onclick=()=>{if(music.paused)music.play().catch(()=>{});else music.pause()};

const cv=$('#cake'),c=cv.getContext('2d');let dots=[],cakeBorn=performance.now();function addDot(x,y,z,color,size=1.5){dots.push({x,y,z,color,s:size,k:Math.random()*7,dx:(Math.random()-.5)*560,dy:(Math.random()-.5)*700,dz:(Math.random()-.5)*380})}function surface(rx,y,n,color){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*rx;addDot(Math.cos(a)*r,y+(Math.random()-.5)*3,Math.sin(a)*r,color,.7+Math.random()*1.3)}}function wall(rx,y1,y2,n,color){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2;addDot(Math.cos(a)*rx,y1+Math.random()*(y2-y1),Math.sin(a)*rx,color,.8+Math.random()*1.4)}}function cream(rx,y,n){for(let i=0;i<n;i++){let a=i/n*Math.PI*2,r=rx+Math.sin(a*16)*3;for(let j=0;j<3;j++)addDot(Math.cos(a)*(r+j*1.5),y+Math.sin(a*16)*3+j*1.4,Math.sin(a)*(r+j*1.5),j===0?'#fff8df':'#ffd9e5',1.6)}}function resizeCake(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);dots=[];surface(128,153,1700,'#c5d9c9');wall(118,87,145,2300,'#f5b5c5');surface(118,87,1800,'#fff3dd');cream(119,89,850);cream(115,145,700);wall(80,29,82,1800,'#fff2dc');surface(80,29,1300,'#fff9e9');cream(82,31,670);cream(80,82,500);for(let i=0;i<36;i++){let a=i/36*Math.PI*2;addDot(Math.cos(a)*107,86,Math.sin(a)*107,['#e9828b','#f8cc80','#b3d0bc'][i%3],4)}for(let i=0;i<24;i++){let a=i/24*Math.PI*2;addDot(Math.cos(a)*67,27,Math.sin(a)*67,['#e9828b','#f5be83'][i%2],3)}cakeBorn=performance.now()}function proj(p,t){let a=Math.sin(t*.0003)*.1,co=Math.cos(a),si=Math.sin(a),x=p.x*co-p.z*si,z=p.x*si+p.z*co,scale=Math.min(innerWidth/320,innerHeight/620,1.25);return{x:innerWidth/2+x*scale,y:innerHeight*.55+(p.y-65)*scale*.8+z*scale*.36,s:scale}}function drawCake(t){if(page==='p2'||page==='p3'){c.clearRect(0,0,innerWidth,innerHeight);let progress=Math.min(1,(t-cakeBorn)/2400),ease=1-(1-progress)**3;dots.forEach(p=>{let q=proj({...p,x:p.x+p.dx*(1-ease),y:p.y+p.dy*(1-ease),z:p.z+p.dz*(1-ease)},t);c.globalAl width=Math.min(100,rms/threshold*65)+'%';if(rms>threshold)above+=Math.min(now-last,100);else above=Math.max(0,above-60);last=now;if(above>220){finishBlow();return}micFrame=requestAnimationFrame(listen)}micFrame=requestAnimationFrame(listen)}catch(e){clearTimeout(permissionTimer);$('#micStatus').textContent='需要麦克风权限才能吹灭蜡烛';$('#retryMic').style.display='inline-block';console.warn('Microphone unavailable',e)}}
