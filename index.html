let lastFaceFrame=0,faceX=innerWidth/2,faceY=innerHeight*.34,faceW=120;function track(t){if(page==='p1'&&detector&&$('#video').readyState>=2&&t-lastFaceFrame>75){lastFaceFrame=t;try{let v=$('#video'),r=detector.detectForVideo?detector.detectForVideo(v,t).detections:detector.detect(v);Promise.resolve(r).then(faces=>{let b=faces?.[0]?.boundingBox;if(!b)return;let scale=Math.max(innerWidth/v.videoWidth,innerHeight/v.videoHeight),ox=(innerWidth-v.videoWidth*scale)/2,oy=(innerHeight-v.videoHeight*scale)/2;let x=ox+((b.originX??b.x)+b.width/2)*scale,y=oy+(b.originY??b.y)*scale,w=b.width*scale;faceX=faceX*.28+(innerWidth-x)*.72;faceY=faceY*.28+y*.72;faceW=faceW*.28+w*.72;let hat=$('#hat'),g=$('#guitar');hat.style.left=faceX+'px';hat.style.top=Math.max(35,faceY-faceW*.76)+'px';hat.style.width=Math.max(90,faceW*1.05)+'px';g.style.left=(faceX+faceW*.38)+'px';g.style.top=(faceY+faceW*1.7)+'px';g.style.width=Math.max(105,faceW*1.25)+'px';$('#status').textContent='生日帽已跟上你啦 ✨'}).catch(()=>{})}catch(e){}}requestAnimationFrame(track)}
